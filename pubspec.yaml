name: deehelp
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  # https://pub.dev/packages/intl
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2

  uuid: ^4.0.0
  #  https://pub:dev/packages/dartz/install:
  dartz: ^0.10.1
  #  https://pub:dev/packages/firebase_core/install:
  firebase_core: ^4.2.0
  #  https://pub:dev/packages/firebase_auth/install:
  firebase_auth: ^6.1.1
  # https://pub:dev/packages/cloud_firestore/install:
  cloud_firestore: ^6.0.3
  #  https://pub:dev/packages/firebase_storage/install:
  firebase_storage: ^13.0.4
  # https://pub.dev/packages/dotted_border
  dotted_border: ^3.1.0
  # https://pub.dev/packages/flutter_svg
  flutter_svg: ^2.0.16
  # https://pub.dev/packages/go_router
  go_router: ^14.6.2
  # https://pub.dev/packages/dio
  # https://pub.dev/packages/pretty_dio_logger
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  # https://pub.dev/packages/flutter_bloc
  flutter_bloc: ^8.1.6
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  #  https://pub.dev/packages/google_sign_in/install
  google_sign_in: ^7.2.0
  # Location services
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  cupertino_icons: ^1.0.8
  equatable: ^2.0.7
  provider: ^6.1.2
  #  result_dart: ^2.0.0
  flutter_switch: ^0.3.2
  # https://pub:dev/packages/lottie/install:
  lottie: ^3.3.2
  cached_network_image: ^3.2.0
  #  https://pub:dev/packages/image_picker:
  image_picker: ^1.2.1
  url_launcher: ^6.2.0
  whatsapp_unilink: ^2.1.0
  animations: ^2.0.11

  cloudflare_r2: ^0.0.14
  #  https://pub.dev/packages/logging
  logging: ^1.3.0
  #  dart run build_runner build --delete-conflicting-outputs
  freezed_annotation: ^3.1.0
  skeletonizer: ^2.1.1
  sliding_up_panel: ^2.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.0
  flutter_lints: ^5.0.0
  freezed: ^3.2.3
  build_runner: ^2.10.3

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svg/
    - assets/lottie/

  fonts:
    - family: Plus Jakarta
      fonts:
        - asset: assets/fonts/plus_jakarta/PlusJakartaDisplay-Regular.otf
        - asset: assets/fonts/plus_jakarta/PlusJakartaDisplay-Medium.otf
          weight: 500
        - asset: assets/fonts/plus_jakarta/PlusJakartaDisplay-Bold.otf
          weight: 700

    - family: Grandis Extended
      fonts:
        - asset: assets/fonts/grandis_extended/GrandisExtended-Regular.ttf
        - asset: assets/fonts/grandis_extended/GrandisExtended-Thin.ttf
          weight: 300
        - asset: assets/fonts/grandis_extended/GrandisExtended-Medium.ttf
          weight: 500
        - asset: assets/fonts/grandis_extended/GrandisExtended-Bold.ttf
          weight: 700
        - asset: assets/fonts/grandis_extended/GrandisExtended-Black.ttf
          weight: 900

    - family: AlbertSans
      fonts:
        - asset: assets/fonts/albert_sans/AlbertSans-Regular.ttf
        - asset: assets/fonts/albert_sans/AlbertSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/albert_sans/AlbertSans-Italic.ttf
          style: italic
        - asset: assets/fonts/albert_sans/AlbertSans-Light.ttf
          weight: 300

# Comando para gerar o arquivo => flutter gen-l10n
# dart run build_runner build --delete-conflicting-outputs

l10n:
  arb-dir: lib/l10n
  template-arb-file: app_en.arb
  output-localization-file: app_localizations.dart
  supported-locales: [en, pt]
  output-dir: lib/l10n
